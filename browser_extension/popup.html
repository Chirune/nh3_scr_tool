<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>论文采集</title>
<style>body{font:14px "Microsoft YaHei",sans-serif;width:420px;margin:18px;color:#25313d}h1{font-size:19px;margin-bottom:6px}button{padding:9px 12px;margin:3px 3px 3px 0;border:0;border-radius:6px;background:#2464a0;color:white;cursor:pointer}button:disabled{background:#9ba9b7}pre{white-space:pre-wrap;word-break:break-word;max-height:250px;overflow:auto;background:#f3f6fa;padding:10px}.hint{font-size:12px;color:#596674;line-height:1.6}</style></head>
<body><h1>采集当前论文</h1><p>先打开论文并展开正文，再点击读取。</p>
<button id="read">读取本页</button><button id="save" disabled>仅保存采集包</button><button id="all" disabled>下载文件并保存采集包</button><button id="pdf" disabled>单独下载 PDF</button><button id="supp" disabled>单独下载补充材料</button>
<pre id="preview">等待读取。</pre><p class="hint">推荐点“下载文件并保存采集包”，它会尝试 PDF、补充材料与论文图像。等 Chrome 完成后将 JSON 导入工作台第 1 步；经人工保留后，第 3 步可加入采集的正文和文件。下载到的文件仍须核对标题、DOI 与内容。插件不会读取其他标签页或绕过网站权限。</p>
<script src="popup.js"></script></body></html>
